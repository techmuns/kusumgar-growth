name: Discover exhibitions

# Auto-discovers NEW relevant exhibitions from event directories into exhibitions.json.
# Manual (with input) + monthly cron. Commits only when exhibitions.json changed.
on:
  workflow_dispatch:
    inputs:
      max:
        description: 'Max source directories to scan per run'
        required: false
        default: '3'
  schedule:
    - cron: '0 6 10 * *' # 06:00 UTC on the 10th of every month

permissions:
  contents: write

concurrency:
  group: discover-refresh
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Discover exhibitions (graceful without keys)
        env:
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SCRAPEDO_API_KEY: ${{ secrets.SCRAPEDO_API_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          BEDROCK_MODEL_IDS: ${{ secrets.BEDROCK_MODEL_IDS }}
          MAX: ${{ github.event.inputs.max || '3' }}
        run: node scripts/discover-exhibitions.mjs

      - name: Commit & push if changed
        run: |
          if [ -z "$(git status --porcelain public/data/exhibitions.json)" ]; then
            echo "No changes to exhibitions.json — nothing to commit."
            exit 0
          fi
          git config user.name "kgr-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/exhibitions.json
          git commit -m "chore(data): discover new exhibitions"

          branch="${GITHUB_REF_NAME}"
          for i in 1 2 3 4; do
            if git pull --rebase origin "$branch" && git push origin "HEAD:$branch"; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed; retrying in $((2**i))s..."
            sleep $((2**i))
          done
          echo "Failed to push after retries." >&2
          exit 1
