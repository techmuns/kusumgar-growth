<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kusumgar Growth Engine</title>
  <meta name="description" content="AI outreach & exhibition intelligence for Kusumgar." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AA%3C/text%3E%3C/svg%3E" />

  <!-- Tailwind (CDN, no build step) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Guarded so a slow/blocked CDN never throws; when Tailwind loads (the norm) this applies our fonts.
    if (window.tailwind) {
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              display: ['"Plus Jakarta Sans"', 'Inter', 'ui-sans-serif', 'sans-serif'],
            },
          },
        },
      };
    }
  </script>

  <!-- Google Fonts: Inter (body) + Plus Jakarta Sans (display) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- ExcelJS (CDN) for founder-friendly .xlsx export -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>

  <style>
    :root {
      --seg-aeronautical: #0ea5e9;
      --seg-industrial: #f59e0b;
      --seg-military: #6366f1;
      --seg-workwear: #10b981;
    }

    html, body { overflow-x: hidden; }           /* the PAGE never scrolls sideways */

    body {
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      color: #0f172a;
      background-color: #f8fafc;
      /* soft radial color glows: indigo top-left, pink top-right, sky top-center */
      background-image:
        radial-gradient(48rem 48rem at 0% -8%, rgba(99, 102, 241, 0.12), transparent 55%),
        radial-gradient(44rem 44rem at 100% -6%, rgba(236, 72, 153, 0.11), transparent 55%),
        radial-gradient(52rem 40rem at 50% -12%, rgba(14, 165, 233, 0.09), transparent 55%);
      background-attachment: fixed;
      background-repeat: no-repeat;
    }

    .font-display { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; }

    /* tabular numbers so every count / table column lines up */
    .tnum { font-variant-numeric: tabular-nums; }

    /* decorative SVG text never steals hover from its shape (row rects / pills catch it) */
    svg text { pointer-events: none; user-select: none; }

    /* hide scrollbar but keep scrollability (tab strip, table) */
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    /* animated active-tab underline: a 3px indigo->purple gradient bar that scales in */
    .tab-underline {
      transform: scaleX(0);
      transform-origin: center;
      transition: transform .28s cubic-bezier(.4, 0, .2, 1);
    }
    .tab-btn[data-active="true"] .tab-underline { transform: scaleX(1); }

    /* floating chart tooltip */
    #tooltip {
      position: fixed;
      z-index: 60;
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .12s ease, transform .12s ease;
      background: #0f172a;
      color: #fff;
      font-size: 12px;
      line-height: 1.35;
      padding: 8px 10px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(2, 6, 23, .25);
      max-width: 260px;
      white-space: normal;
    }
    #tooltip.show { opacity: 1; transform: translateY(0); }
    #tooltip .tt-title { font-weight: 700; }
    #tooltip .tt-sub { color: #cbd5e1; font-weight: 500; }

    /* chart entrance / reveal helpers */
    .reveal-bar { transition: width 1s cubic-bezier(.22, 1, .36, 1); }
    .reveal-arc { transition: stroke-dasharray 1.1s cubic-bezier(.22, 1, .36, 1); }
    .reveal-pill {
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .5s ease, transform .5s ease;
    }
    .reveal-pill.in { opacity: 1; transform: translateY(0); }

    /* coverage-matrix dots: pop in on load, ring on hover */
    .reveal-pop {
      opacity: 0;
      transform: scale(.3);
      transition: opacity .35s ease, transform .45s cubic-bezier(.34, 1.56, .64, 1);
    }
    .reveal-pop.in { opacity: 1; transform: scale(1); }
    .mx-dot { transition: box-shadow .12s ease; cursor: default; }
    .mx-dot:hover { box-shadow: 0 0 0 3px rgba(2, 6, 23, .10); }

    /* drill-panel (right slide-over) */
    #drawer { position: fixed; inset: 0; z-index: 50; visibility: hidden; }
    #drawer.open { visibility: visible; }
    #drawer [data-drawer-backdrop] { opacity: 0; transition: opacity .26s ease; }
    #drawer.open [data-drawer-backdrop] { opacity: 1; }
    .drawer-panel { transform: translateX(100%); transition: transform .28s cubic-bezier(.4, 0, .2, 1); }
    #drawer.open .drawer-panel { transform: translateX(0); }

    /* email / outreach modal */
    #modal { position: fixed; inset: 0; z-index: 70; visibility: hidden; }
    #modal.open { visibility: visible; }
    #modal [data-modal-backdrop] { opacity: 0; transition: opacity .2s ease; }
    #modal.open [data-modal-backdrop] { opacity: 1; }
    .modal-card { opacity: 0; transform: translate(-50%, -50%) scale(.96); transition: opacity .2s ease, transform .2s cubic-bezier(.34, 1.56, .64, 1); }
    #modal.open .modal-card { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    @media (prefers-reduced-motion: reduce) {
      #drawer [data-drawer-backdrop], .drawer-panel, #modal [data-modal-backdrop], .modal-card { transition: none !important; }
    }

    .fade-in { animation: fadeIn .35s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      .reveal-bar, .reveal-arc, .reveal-pill, .reveal-pop, .reveal-scale, .tab-underline, .fade-in { transition: none !important; animation: none !important; }
    }

    /* ============ Market Deck (print-to-PDF) ============ */
    #deck { position: fixed; inset: 0; z-index: 90; visibility: hidden; overflow-y: auto; background: #eef2f7; }
    #deck.open { visibility: visible; }
    .deck-toolbar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; background: rgba(255,255,255,.9); backdrop-filter: blur(6px); border-bottom: 1px solid #e2e8f0; }
    .deck-pages { padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
    /* Landscape "slide": A4-landscape ratio, flex column so the body FILLS between header & footer.
       Same box on screen and in print — what you see is what prints. */
    .deck-slide {
      width: 100%; max-width: 1060px; aspect-ratio: 297 / 210; background: #fff; color: #0f172a;
      border-radius: 14px; box-shadow: 0 10px 30px rgba(2,6,23,.10);
      padding: 34px 40px; box-sizing: border-box; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .deck-slide h2 { font-family: 'Plus Jakarta Sans', sans-serif; }
    /* the middle region grows and vertically centres its content — no top-bunched blank bands */
    .deck-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
    .deck-slide svg { display: block; height: auto; }

    @media print {
      @page { size: A4 landscape; margin: 0; }
      html, body { background: #fff !important; }
      body * { visibility: hidden !important; }
      #deck, #deck * { visibility: visible !important; }
      #deck { position: static !important; inset: auto !important; overflow: visible !important; background: #fff !important; }
      .deck-toolbar { display: none !important; }
      .deck-pages { padding: 0 !important; gap: 0 !important; }
      .deck-slide {
        width: 297mm; height: 210mm; max-width: none !important; aspect-ratio: auto !important;
        overflow: hidden; break-inside: avoid; page-break-after: always;
        border-radius: 0 !important; box-shadow: none !important; margin: 0 !important;
      }
      .deck-slide:last-child { page-break-after: auto; }
      .reveal-scale { transform: none !important; }
      /* Wipe-reveal clip-paths don't paint reliably in print/PDF — drop them so charts render fully. */
      #deck [clip-path] { clip-path: none !important; }
    }
  </style>
</head>

<body class="min-h-screen antialiased">
  <div class="mx-auto w-full max-w-6xl px-4 sm:px-6 pb-16">

    <!-- ============ HEADER ============ -->
    <header class="pt-6 pb-4">
      <div class="flex items-center gap-3 sm:gap-4">
        <div class="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 text-white font-display font-extrabold tracking-tight shadow-lg shadow-indigo-500/25">
          KGR
        </div>
        <div class="min-w-0 flex-1">
          <h1 class="font-display text-xl sm:text-2xl font-extrabold tracking-tight text-slate-900 leading-tight">
            Kusumgar Growth Engine
          </h1>
          <p class="text-sm text-slate-500 truncate">AI outreach &amp; exhibition intelligence</p>
        </div>
        <div class="flex shrink-0 items-center gap-2">
          <button id="btnProducts" type="button"
            class="inline-flex items-center gap-1.5 rounded-xl bg-white px-3 py-2 text-sm font-semibold text-slate-600 shadow-sm ring-1 ring-slate-200 transition-colors hover:bg-slate-50">
            🧵 <span class="hidden sm:inline">Products</span>
          </button>
          <button id="btnExport" type="button"
            class="inline-flex items-center gap-1.5 rounded-xl bg-emerald-600 px-3 py-2 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-emerald-700">
            📊 <span class="hidden sm:inline">Export</span>
          </button>
          <div id="updatedPill"
               class="hidden lg:inline-flex items-center gap-1.5 rounded-full bg-white/70 px-3 py-1.5 text-xs font-medium text-slate-500 ring-1 ring-slate-200 backdrop-blur">
            <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>
            <span id="updatedText">Updated …</span>
          </div>
        </div>
      </div>

      <!-- Global search (⌘K) -->
      <div class="relative mt-3">
        <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">🔎</span>
        <input id="globalSearch" type="search" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="searchResults"
          placeholder="Search companies, exhibitions, products, competitors…"
          class="w-full rounded-xl border-0 bg-white/80 py-2.5 pl-9 pr-14 text-sm text-slate-700 shadow-sm ring-1 ring-slate-200 backdrop-blur focus:ring-2 focus:ring-indigo-400 focus:outline-none" />
        <kbd class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 rounded-md bg-slate-100 px-1.5 py-0.5 text-[10px] font-semibold text-slate-400 ring-1 ring-slate-200">⌘K</kbd>
        <div id="searchResults" hidden class="absolute left-0 right-0 z-40 mt-1 max-h-[60vh] overflow-y-auto rounded-xl bg-white p-1.5 shadow-xl ring-1 ring-slate-200"></div>
      </div>
    </header>

    <!-- ============ TAB BAR ============ -->
    <nav id="tabBar"
         class="no-scrollbar -mx-4 sm:mx-0 flex gap-1 overflow-x-auto border-b border-slate-200 px-4 sm:px-0"
         aria-label="Primary">
      <!-- buttons injected by app.js -->
    </nav>

    <!-- ============ VIEW ROOT ============ -->
    <main id="view" class="pt-5"></main>

    <!-- ============ FOOTER ============ -->
    <footer class="mt-10 flex items-center justify-center gap-1.5 text-[11px] text-slate-400">
      <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>
      <span id="footerFreshness">Kusumgar Growth Engine</span>
    </footer>
  </div>

  <!-- floating tooltip (shared by all charts) -->
  <div id="tooltip" role="status" aria-live="polite"></div>

  <!-- drill-panel (right slide-over), populated by app.js -->
  <div id="drawer"></div>

  <!-- email / outreach modal, populated by app.js -->
  <div id="modal"></div>

  <!-- Market Deck (print-to-PDF), populated by app.js -->
  <div id="deck"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
